name: Build Musicality (APK & IPA)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Version à fabriquer'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - standard
          - studio

jobs:
  build:
    name: 🛠️ Fabrication APK & IPA
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: ☕ Configuration de Java (Pour Android)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Configuration de Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 📦 Téléchargement des dépendances
        run: flutter pub get

      # --- BUILD STANDARD ---
      - name: 🤖 Build Android Standard (APK)
        if: ${{ inputs.variant == 'all' || inputs.variant == 'standard' }}
        run: flutter build apk --release --target-platform android-arm64

      - name: 🍏 Build iOS Standard (IPA)
        if: ${{ inputs.variant == 'all' || inputs.variant == 'standard' }}
        run: |
          flutter build ios --release --no-codesign
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r Musicality_iOS.ipa Payload
          rm -rf Payload

      # --- BUILD STUDIO (Éditeur de paroles & Sync VPS) ---
      - name: 🤖 Build Android Studio (APK Dédiée)
        if: ${{ inputs.variant == 'all' || inputs.variant == 'studio' }}
        run: |
          flutter build apk --release --target-platform android-arm64 --dart-define=STUDIO_MODE=true -Pstudio=true
          mv build/app/outputs/flutter-apk/app-release.apk Musicality_Studio_Android.apk

      - name: 🍏 Build iOS Studio (IPA Dédiée)
        if: ${{ inputs.variant == 'all' || inputs.variant == 'studio' }}
        run: |
          flutter build ios --release --no-codesign --dart-define=STUDIO_MODE=true
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload/
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.example.musicality.studio" Payload/Runner.app/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Musicality Studio" Payload/Runner.app/Info.plist || true
          zip -r Musicality_Studio_iOS.ipa Payload
          rm -rf Payload

      # --- UPLOADS DES ARTIFACTS ---
      - name: 🚀 Upload APK Standard
        if: ${{ inputs.variant == 'all' || inputs.variant == 'standard' }}
        uses: actions/upload-artifact@v4
        with:
          name: Musicality-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 🚀 Upload APK Studio
        if: ${{ inputs.variant == 'all' || inputs.variant == 'studio' }}
        uses: actions/upload-artifact@v4
        with:
          name: Musicality-Studio-Android-APK
          path: Musicality_Studio_Android.apk

      - name: 🚀 Upload IPA Standard
        if: ${{ inputs.variant == 'all' || inputs.variant == 'standard' }}
        uses: actions/upload-artifact@v4
        with:
          name: Musicality-iOS-IPA
          path: Musicality_iOS.ipa

      - name: 🚀 Upload IPA Studio
        if: ${{ inputs.variant == 'all' || inputs.variant == 'studio' }}
        uses: actions/upload-artifact@v4
        with:
          name: Musicality-Studio-iOS-IPA
          path: Musicality_Studio_iOS.ipa

      - name: 🏷️ Extraction de la version de l'app
        id: extract_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: 🌟 Création de la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Musicality v${{ env.APP_VERSION }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            Musicality_Studio_Android.apk
            Musicality_iOS.ipa
            Musicality_Studio_iOS.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
