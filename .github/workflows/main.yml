name: Build Musicality (IPA)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      variant:
        description: 'Version iOS à fabriquer (IPA)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - standard
          - studio

jobs:
  build:
    name: 🍏 Fabrication IPA (iOS)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 🐦 Configuration de Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 📦 Téléchargement des dépendances
        run: flutter pub get

      # --- BUILD STANDARD ---
      - name: 🍏 Build iOS Standard (IPA)
        if: ${{ github.event_name == 'push' || inputs.variant == 'all' || inputs.variant == 'standard' }}
        run: |
          flutter build ios --release --no-codesign
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r Musicality_iOS.ipa Payload
          rm -rf Payload

      # --- BUILD STUDIO (Éditeur de paroles & Sync VPS) ---
      - name: 🍏 Build iOS Studio (IPA Dédiée)
        if: ${{ github.event_name == 'push' || inputs.variant == 'all' || inputs.variant == 'studio' }}
        run: |
          flutter build ios --release --no-codesign --dart-define=STUDIO_MODE=true
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload/
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.example.musicality.studio" Payload/Runner.app/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Musicality Studio" Payload/Runner.app/Info.plist || true
          zip -r Musicality_Studio_iOS.ipa Payload
          rm -rf Payload

      # --- UPLOADS DES ARTIFACTS ---
      - name: 🚀 Upload IPA Standard
        if: ${{ github.event_name == 'push' || inputs.variant == 'all' || inputs.variant == 'standard' }}
        uses: actions/upload-artifact@v4
        with:
          name: Musicality-iOS-IPA
          path: Musicality_iOS.ipa

      - name: 🚀 Upload IPA Studio
        if: ${{ github.event_name == 'push' || inputs.variant == 'all' || inputs.variant == 'studio' }}
        uses: actions/upload-artifact@v4
        with:
          name: Musicality-Studio-iOS-IPA
          path: Musicality_Studio_iOS.ipa

      - name: 🏷️ Extraction de la version de l'app
        id: extract_version
        run: |
          SEMVER=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1 | tr -d '\r')
          BUILD=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 2 | tr -d '\r')
          if [ -n "$BUILD" ] && [ "$BUILD" != "$SEMVER" ]; then
            VERSION="${SEMVER}(${BUILD})"
          else
            VERSION="$SEMVER"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: 🌟 Création de la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: Musicality ${{ env.APP_VERSION }}
          files: |
            Musicality_iOS.ipa
            Musicality_Studio_iOS.ipa
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
