name: musicality
description: "A new Flutter project."
publish_to: 'none'

version: 0.9.2-beta+204
environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  audio_service: ^0.18.11
  just_audio: ^0.10.6
  rxdart: ^0.28.0
  path_provider: ^2.1.0

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  cronet_http: ^1.9.0
  url_launcher: ^6.2.5
  audio_session: ^0.2.4
  image_picker: ^1.2.3
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  google_sign_in: ^7.2.0
  mmkv: ^2.4.1
  package_info_plus: ^10.2.1
  open_filex: ^4.7.0
  just_waveform: ^0.0.7
  liquid_glass_widgets: ^1.1.0
  firebase_crashlytics: ^5.3.0
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  path: ^1.9.1
  dartssh2: ^4.1.0
  battery_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.15.1
  objectbox_generator: ^5.3.2

flutter:
  uses-material-design: true

  shaders:
    - shaders/liquid_glass.frag
    - shaders/rhombus_glass.frag

  assets:
    - assets/audio/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 24
